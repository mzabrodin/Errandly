name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      # Migrations, the dev seed and the integration health check run against a real database
      postgresql:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: errandly
          POSTGRES_PASSWORD: errandly
          POSTGRES_DB: errandly
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U errandly -d errandly"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://errandly:errandly@localhost:5432/errandly
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Commit messages
        if: github.event_name == 'pull_request'
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}
      - run: npm run format:check
      - run: npm run lint
      - run: npm run build
      - name: API contract is up to date
        run: |
          npm run api:sync
          git diff --exit-code -- backend/openapi.json frontend/src/shared/api/schema.d.ts
      - name: Migrations match the schema
        run: |
          npm run db:generate -w backend
          git diff --exit-code -- backend/drizzle
          test -z "$(git status --porcelain -- backend/drizzle)"
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm test -w frontend
      - run: npm run test:cov -w backend
      - run: npm run test:integration -w backend

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Start the stack
        run: docker compose up --build -d --wait
      - name: Smoke test through nginx
        run: curl -fsS http://localhost:8080/api/health | grep -q '"database":"up"'
      - name: Logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop
        if: always()
        run: docker compose down -v
