# Local stack. Variables: .env.example (copy to .env to override the dev defaults)
#   docker compose up -d --build        app http://localhost:8080, Mailpit http://localhost:8025
#                                       (Swagger UI only with npm run dev:backend, NODE_ENV=development)
#   docker compose up -d postgresql mailpit   dependencies only, when the backend runs on the host
#   docker compose logs -f backend      JSON logs; find a request by its X-Request-Id
#   docker compose down                 stop, data is kept
#   docker compose down -v              stop and delete the database
#
# Ports are bound to 127.0.0.1, so the services are reachable only from this machine.
# Networks: frontend (nginx -> backend), backend (backend -> postgresql, mailpit);
# nginx cannot reach the database or Mailpit.

name: errandly

x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

x-service: &service
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging: *default-logging

services:
  postgresql:
    <<: *service
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-errandly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-errandly}
      POSTGRES_DB: ${POSTGRES_DB:-errandly}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      # PostgreSQL 18 images keep data under /var/lib/postgresql/<major>
      - postgresql-data:/var/lib/postgresql
    networks: [backend]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    <<: *service
    image: axllent/mailpit:v1.31
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - '127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025'
      - '127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025'
    networks: [backend]

  backend:
    <<: *service
    image: errandly/backend:local
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      APP_URL: http://localhost:${APP_PORT:-8080}
      DATABASE_URL: postgresql://${POSTGRES_USER:-errandly}:${POSTGRES_PASSWORD:-errandly}@postgresql:5432/${POSTGRES_DB:-errandly}
      # Mailpit unless .env points at a real SMTP server
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      # Dev endpoint for emails from the frontend mock API; ignored unless SMTP is Mailpit
      MAIL_DEV_API: ${MAIL_DEV_API:-true}
    ports:
      - '127.0.0.1:${API_PORT:-3000}:3000'
    networks: [frontend, backend]
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/api/health']
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5
    depends_on:
      postgresql:
        condition: service_healthy
      mailpit:
        condition: service_started

  frontend:
    <<: *service
    image: errandly/frontend:local
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - '127.0.0.1:${APP_PORT:-8080}:80'
    networks: [frontend]
    depends_on:
      backend:
        condition: service_healthy

networks:
  frontend:
  backend:

volumes:
  postgresql-data:
