services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-errandly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-errandly}
      POSTGRES_DB: ${POSTGRES_DB:-errandly}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      PORT: 3000
      FRONTEND_URL: http://localhost:8080
      DATABASE_URL: postgresql://${POSTGRES_USER:-errandly}:${POSTGRES_PASSWORD:-errandly}@db:5432/${POSTGRES_DB:-errandly}
    ports:
      - '3000:3000'
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - '8080:80'
    depends_on:
      - backend

volumes:
  db-data:
