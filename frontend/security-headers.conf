# Helmet sets these on /api responses; the SPA files never reach Nest, so nginx sets them here.
# A location with its own add_header drops the server-level ones, hence an include per location.
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https://lh3.googleusercontent.com; font-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
