log_format json escape=json '{"time":"$time_iso8601","request_id":"$request_id",'
  '"method":"$request_method","uri":"$request_uri","status":$status,'
  '"bytes":$body_bytes_sent,"duration":$request_time,"user_agent":"$http_user_agent"}';

# Flood control in front of the app's own per-account limits (NFR-SEC-07)
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;
  access_log /var/log/nginx/access.log json;
  # The avatar upload is the largest body the API takes
  client_max_body_size 1m;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  location /api/ {
    limit_req zone=api burst=40 nodelay;
    limit_req_status 429;
    error_page 429 = @too_many_requests;
    error_page 413 = @too_large;

    proxy_pass http://backend:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Request-Id $request_id;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location @too_many_requests {
    default_type application/json;
    add_header Retry-After 1 always;
    return 429 '{"code":"TOO_MANY_REQUESTS","retryAfterSeconds":1}';
  }

  location @too_large {
    default_type application/json;
    return 413 '{"code":"FILE_TOO_LARGE"}';
  }

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 'ok';
  }

  # Vite puts a content hash in every asset file name
  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
